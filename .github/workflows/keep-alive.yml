name: Keep-alive Supabase

on:
  schedule:
    - cron: '0 12 * * *' # todo dia, 12:00 UTC
  workflow_dispatch: # permite rodar manualmente tambem, pra testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de health
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
        run: |
          curl -sf -X POST "$SUPABASE_FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -d '{"action":"health"}'
